<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f2f7;--surface:#fff;--surface2:#f2f2f7;--surface3:#e5e5ea;
  --text:#1c1c1e;--text2:#636366;--text3:#aeaeb2;
  --accent:#007aff;--accent2:#5856d6;--grad:linear-gradient(135deg,#007aff,#5856d6);
  --border:rgba(0,0,0,.08);
  --shadow:0 2px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
  --r:14px;--r-sm:10px;--r-xs:7px;
  --green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#30b0c7;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
body.dark{
  --bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--surface3:#3a3a3c;
  --text:#fff;--text2:rgba(235,235,245,.8);--text3:rgba(235,235,245,.4);
  --border:rgba(255,255,255,.1);
  --shadow:0 2px 12px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit}

/* HEADER */
.header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  height:60px;flex-shrink:0;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.logo{font-size:18px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);font-size:17px;transition:all .2s;cursor:pointer;border:none;
}
.icon-btn:hover{background:var(--surface3);transform:scale(1.05)}

/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:260px;min-width:260px;background:var(--surface);
  border-right:1px solid var(--border);padding:16px;
  display:flex;flex-direction:column;gap:16px;overflow-y:auto;
}
.section-title{
  font-size:11px;font-weight:600;color:var(--text3);
  letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;
}

/* MINI CALENDAR */
.mini-cal{background:var(--surface2);border-radius:var(--r);padding:14px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:13px;font-weight:600}
.cal-nav{
  background:none;border:none;color:var(--text2);font-size:16px;
  padding:2px 8px;cursor:pointer;border-radius:var(--r-xs);transition:background .2s;
}
.cal-nav:hover{background:var(--surface3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-day-label{font-size:10px;font-weight:500;color:var(--text3);text-align:center;padding:3px 0}
.cal-day{
  font-size:11px;text-align:center;padding:4px 1px;
  border-radius:50%;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:1px;line-height:1;aspect-ratio:1;
}
.cal-day:hover{background:var(--surface3)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:600}
.cal-day.has-events::after{
  content:'';display:block;width:3px;height:3px;border-radius:50%;
  background:var(--accent);flex-shrink:0;
}
.cal-day.today.has-events::after{background:#fff}
.cal-day.other-month{color:var(--text3)}

/* CAT FILTER */
.cat-list{display:flex;flex-direction:column;gap:4px}
.cat-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-radius:var(--r-xs);cursor:pointer;font-size:13px;transition:all .2s;
}
.cat-item:hover{background:var(--surface2)}
.cat-item.active{background:var(--surface2);font-weight:500}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-count{
  margin-left:auto;font-size:11px;color:var(--text3);
  background:var(--surface3);padding:1px 6px;border-radius:20px;
}

/* UPCOMING */
.upcoming-list{display:flex;flex-direction:column;gap:7px}
.upcoming-item{
  background:var(--surface2);border-radius:var(--r-sm);padding:9px 11px;
  cursor:pointer;transition:all .2s;border-left:3px solid var(--accent);
}
.upcoming-item:hover{transform:translateX(2px);box-shadow:var(--shadow)}
.upcoming-item-title{font-size:12px;font-weight:500;margin-bottom:1px}
.upcoming-item-time{font-size:10px;color:var(--text2)}

/* CONTENT */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* TOOLBAR */
.week-toolbar{
  display:flex;align-items:center;gap:10px;padding:12px 20px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;flex-wrap:wrap;
}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav button{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-xs);padding:6px 13px;font-size:14px;
  font-weight:500;color:var(--text);cursor:pointer;transition:all .2s;
}
.week-nav button:hover{background:var(--surface3)}
.week-label{font-size:15px;font-weight:600;min-width:150px;text-align:center}
.today-btn{
  background:var(--grad);color:#fff;border:none;border-radius:var(--r-xs);
  padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;
}
.today-btn:hover{opacity:.9;transform:scale(1.02)}
.search-wrap{position:relative}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:13px}
.search-input{
  background:var(--surface2);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px 6px 30px;font-size:13px;width:160px;color:var(--text);outline:none;transition:all .2s;
}
.search-input:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.15);width:200px}
.add-btn{
  background:var(--grad);color:#fff;border:none;border-radius:var(--r-sm);
  padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap;margin-left:auto;
}
.add-btn:hover{opacity:.9;transform:scale(1.02);box-shadow:0 4px 16px rgba(0,122,255,.3)}

/* TIMETABLE SCROLL AREA */
.timetable-scroll{flex:1;overflow:auto;position:relative}

/* TIMETABLE */
.timetable{display:flex;min-width:700px}
.time-col{width:56px;flex-shrink:0;position:relative}
.time-col-inner{position:relative}
.time-label{
  height:60px;display:flex;align-items:flex-start;justify-content:flex-end;
  padding-right:8px;font-size:11px;color:var(--text3);padding-top:3px;
  font-weight:500;position:relative;
}
.time-label::after{
  content:'';position:absolute;right:0;top:0;width:6px;height:1px;background:var(--border);
}
/* sticky time header spacer */
.time-header-spacer{height:52px;position:sticky;top:0;background:var(--surface);z-index:20;border-bottom:1px solid var(--border)}

.days-grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day-col{border-right:1px solid var(--border);position:relative}
.day-col:last-child{border-right:none}
.day-header{
  height:52px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-bottom:1px solid var(--border);gap:1px;
  font-size:11px;color:var(--text2);font-weight:500;
  position:sticky;top:0;background:var(--surface);z-index:20;
}
.day-header.today-col{color:var(--accent)}
.day-num{
  font-size:16px;font-weight:700;line-height:1;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;
}
.day-header.today-col .day-num{background:var(--grad);color:#fff}

.day-body{position:relative}
.hour-line{position:absolute;left:0;right:0;height:1px;background:var(--border)}

.event-block{
  position:absolute;left:3px;right:3px;border-radius:var(--r-xs);
  padding:4px 6px;cursor:pointer;overflow:hidden;transition:all .2s;z-index:5;
  border-left:3px solid rgba(0,0,0,.15);
}
.event-block:hover{filter:brightness(.93);transform:scale(1.02);box-shadow:var(--shadow-lg);z-index:20}
.event-title{font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-time{font-size:10px;opacity:.8;line-height:1.2;margin-top:1px}

.now-line{position:absolute;left:0;right:0;z-index:15;pointer-events:none}
.now-line::before{content:'';position:absolute;left:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.now-line::after{content:'';position:absolute;left:6px;right:0;top:0;height:1px;background:var(--red)}

/* MODAL */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);border-radius:var(--r) var(--r) 0 0;
  width:100%;max-width:520px;padding:22px;max-height:90vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,0,.67,0);
}
.overlay.show .modal{transform:translateY(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.modal-handle{width:36px;height:4px;background:var(--surface3);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.form-input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 13px;font-size:14px;color:var(--text);outline:none;transition:all .2s;
}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-select{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cat-option{
  border:2px solid var(--border);border-radius:var(--r-xs);padding:7px 2px;
  text-align:center;cursor:pointer;font-size:11px;font-weight:500;
  transition:all .2s;color:var(--text2);
}
.cat-option.selected{border-color:var(--accent);background:rgba(0,122,255,.08);color:var(--accent)}
.color-select{display:flex;gap:9px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:all .2s;border:3px solid transparent}
.color-dot.selected{border-color:var(--text);transform:scale(1.15)}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-primary{flex:1;background:var(--grad);color:#fff;border:none;border-radius:var(--r-sm);padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary:hover{opacity:.9;transform:scale(1.01)}
.btn-danger{background:rgba(255,59,48,.12);color:var(--red);border:none;border-radius:var(--r-sm);padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-danger:hover{background:rgba(255,59,48,.2)}
.btn-cancel{background:var(--surface2);color:var(--text2);border:none;border-radius:var(--r-sm);padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-cancel:hover{background:var(--surface3)}

/* CONFIRM DIALOG */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1100;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;
}
.confirm-overlay.show{opacity:1;pointer-events:all}
.confirm-box{
  background:var(--surface);border-radius:var(--r);padding:26px;width:290px;text-align:center;
  transform:scale(.92);transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:var(--shadow-lg);
}
.confirm-overlay.show .confirm-box{transform:scale(1)}
.confirm-icon{font-size:38px;margin-bottom:10px}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:7px}
.confirm-desc{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;padding:11px;border-radius:var(--r-xs);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.confirm-btns .yes{background:var(--red);color:#fff}
.confirm-btns .yes:hover{opacity:.85}
.confirm-btns .no{background:var(--surface2);color:var(--text)}
.confirm-btns .no:hover{background:var(--surface3)}

.empty-up{color:var(--text3);font-size:12px;text-align:center;padding:12px 0}

@media(max-width:900px){.sidebar{display:none}}
@media(max-width:640px){
  .week-toolbar{padding:10px 12px}
  .week-label{font-size:13px;min-width:110px}
  .search-wrap{display:none}
}
</style>
</head>
<body>

<div class="header">
  <span class="logo">📅 My Schedule</span>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleSearch()" title="ค้นหา">🔍</button>
    <button class="icon-btn" id="darkToggle" onclick="toggleDark()" title="Dark Mode">🌙</button>
  </div>
</div>

<div class="main">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="mini-cal">
      <div class="cal-header">
        <button class="cal-nav" onclick="prevMonth()">‹</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-nav" onclick="nextMonth()">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div>
      <div class="section-title">ประเภท</div>
      <div class="cat-list" id="catList"></div>
    </div>

    <div>
      <div class="section-title">กำลังจะมาถึง</div>
      <div class="upcoming-list" id="upcomingList"></div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="content">
    <div class="week-toolbar">
      <div class="week-nav">
        <button onclick="prevWeek()">‹</button>
        <span class="week-label" id="weekLabel"></span>
        <button onclick="nextWeek()">›</button>
      </div>
      <button class="today-btn" onclick="goToday()">วันนี้</button>
      <div class="search-wrap" id="searchWrap" style="display:none">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" placeholder="ค้นหากิจกรรม..." oninput="renderWeek();renderSidebar()">
      </div>
      <button class="add-btn" onclick="openAddModal()">+ เพิ่มกิจกรรม</button>
    </div>

    <!-- SCROLLABLE TIMETABLE -->
    <div class="timetable-scroll" id="timetableScroll">
      <div class="timetable">
        <!-- Time column -->
        <div class="time-col">
          <div class="time-header-spacer"></div>
          <div class="time-col-inner" id="timeCol"></div>
        </div>
        <!-- Days grid -->
        <div class="days-grid" id="daysGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- EVENT MODAL -->
<div class="overlay" id="eventOverlay" onclick="closeIfOverlay(event)">
  <div class="modal" id="eventModal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">เพิ่มกิจกรรม</div>
    <div class="form-group">
      <label class="form-label">ชื่อกิจกรรม</label>
      <input class="form-input" id="fTitle" placeholder="เช่น Math Class, Meeting...">
    </div>
    <div class="form-group">
      <label class="form-label">ประเภท</label>
      <div class="cat-select" id="catSelect"></div>
    </div>
    <div class="form-group">
      <label class="form-label">วันที่</label>
      <input class="form-input" type="date" id="fDate">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">เวลาเริ่ม</label>
        <input class="form-input" type="time" id="fStart" value="09:00">
      </div>
      <div class="form-group">
        <label class="form-label">เวลาจบ</label>
        <input class="form-input" type="time" id="fEnd" value="10:00">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">รายละเอียด</label>
      <textarea class="form-input" id="fDesc" rows="2" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">สีกิจกรรม</label>
      <div class="color-select" id="colorSelect"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-danger" id="deleteBtn" onclick="deleteCurrentEvent()" style="display:none">ลบ</button>
      <button class="btn-primary" onclick="saveEvent()">บันทึก</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">ลบกิจกรรม?</div>
    <div class="confirm-desc">คุณต้องการลบกิจกรรมนี้หรือไม่?<br>การกระทำนี้ไม่สามารถยกเลิกได้</div>
    <div class="confirm-btns">
      <button class="no" onclick="closeConfirm()">ยกเลิก</button>
      <button class="yes" onclick="confirmDelete()">ลบ</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  {id:'study', label:'เรียน',   icon:'📘', color:'#007aff'},
  {id:'tutor', label:'ติว',     icon:'📚', color:'#5856d6'},
  {id:'work',  label:'งาน',     icon:'💼', color:'#ff9500'},
  {id:'meet',  label:'นัดหมาย',icon:'🤝', color:'#34c759'},
  {id:'other', label:'อื่น ๆ', icon:'🎯', color:'#af52de'},
];
const COLORS = ['#007aff','#5856d6','#34c759','#ff9500','#ff3b30','#af52de','#ff2d55','#30b0c7','#ff6b35','#1a1a2e'];
const DAY_SHORT = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const DAY_FULL  = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MONTHS_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

// 8-hour visible window (in hours from midnight)
const HOUR_PX   = 64;   // px per hour
const VISIBLE_H = 8;    // hours shown in viewport
const TOTAL_H   = 24;   // total hours rendered

let events = [];
let editId = null;
let calDate = new Date();
let weekStart = getMondayOf(new Date());
let filterCat = null;
let deleteTarget = null;

/* ── helpers ── */
function getMondayOf(d) {
  const day = new Date(d);
  const dow = day.getDay();
  day.setDate(day.getDate() - (dow === 0 ? 6 : dow - 1));
  day.setHours(0,0,0,0);
  return day;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmt(d)         { return d.toISOString().split('T')[0]; }
function fmtTime(s)     { if (!s) return ''; const [h,m] = s.split(':'); return `${parseInt(h)}:${m}`; }
function parseMin(s)    { if (!s) return 0; const [h,m] = s.split(':').map(Number); return h*60+m; }
function uid()          { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function addMins(t, m)  {
  const [h, mn] = t.split(':').map(Number);
  const tot = h*60 + mn + m;
  return `${String(Math.floor(tot/60)%24).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
}
function hexBright(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 0.299*r + 0.587*g + 0.114*b;
}

/* ── sample data ── */
function initSamples() {
  const add = n => fmt(addDays(getMondayOf(new Date()), n));
  events = [
    {id:uid(), title:'Math Class',      cat:'study', date:add(0), start:'08:00', end:'10:00', desc:'ห้อง 301',      color:'#007aff'},
    {id:uid(), title:'Coding Study',    cat:'study', date:add(0), start:'14:00', end:'16:00', desc:'JavaScript ES6', color:'#5856d6'},
    {id:uid(), title:'Workout',         cat:'other', date:add(0), start:'17:00', end:'18:30', desc:'Gym',            color:'#34c759'},
    {id:uid(), title:'Physics Tutor',   cat:'tutor', date:add(1), start:'18:00', end:'20:00', desc:'',               color:'#af52de'},
    {id:uid(), title:'Project Meeting', cat:'work',  date:add(2), start:'10:00', end:'11:00', desc:'Zoom call',      color:'#ff9500'},
    {id:uid(), title:'English Class',   cat:'study', date:add(2), start:'13:00', end:'14:00', desc:'',               color:'#30b0c7'},
    {id:uid(), title:'Chemistry Lab',   cat:'study', date:add(3), start:'08:00', end:'11:00', desc:'Lab 2',          color:'#007aff'},
    {id:uid(), title:'Team Meeting',    cat:'meet',  date:add(4), start:'14:00', end:'15:00', desc:'',               color:'#34c759'},
    {id:uid(), title:'Weekend Study',   cat:'study', date:add(5), start:'09:00', end:'12:00', desc:'',               color:'#5856d6'},
  ];
  save();
}
function save() { try { localStorage.setItem('sched_v3', JSON.stringify(events)); } catch(e) {} }
function load() { try { const d = localStorage.getItem('sched_v3'); if (d) events = JSON.parse(d); else initSamples(); } catch(e) { initSamples(); } }

/* ── scroll to current time (or 8:00) ── */
function scrollToNow() {
  const scroller = document.getElementById('timetableScroll');
  if (!scroller) return;
  const now = new Date();
  const min = now.getHours() * 60 + now.getMinutes();
  // scroll so "now" is in the upper third of the 8-hour window
  const targetPx = (min / 60) * HOUR_PX - HOUR_PX;
  scroller.scrollTop = Math.max(0, targetPx);
}

/* ── RENDER ALL ── */
function renderAll() { renderMiniCal(); renderWeek(); renderSidebar(); }

/* ── MINI CALENDAR ── */
function renderMiniCal() {
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('calTitle').textContent = `${MONTHS_TH[m]} ${y+543}`;
  const first = new Date(y, m, 1);
  const last  = new Date(y, m+1, 0);
  const startDow = first.getDay();
  const todayStr = fmt(new Date());
  const evDates  = new Set(events.map(e => e.date));
  let html = DAY_SHORT.map(d => `<div class="cal-day-label">${d}</div>`).join('');

  for (let i = 0; i < startDow; i++) {
    const prev = new Date(y, m, 1 - startDow + i);
    html += `<div class="cal-day other-month${evDates.has(fmt(prev))?' has-events':''}">${prev.getDate()}</div>`;
  }
  for (let d = 1; d <= last.getDate(); d++) {
    const ds = fmt(new Date(y, m, d));
    const cls = ['cal-day', ds===todayStr?'today':'', evDates.has(ds)?'has-events':''].filter(Boolean).join(' ');
    html += `<div class="${cls}" onclick="jumpToDate('${ds}')">${d}</div>`;
  }
  const rem = (7 - (startDow + last.getDate()) % 7) % 7;
  for (let i = 1; i <= rem; i++) {
    const nxt = new Date(y, m+1, i);
    html += `<div class="cal-day other-month${evDates.has(fmt(nxt))?' has-events':''}">${i}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}
function prevMonth() { calDate.setMonth(calDate.getMonth()-1); renderMiniCal(); }
function nextMonth() { calDate.setMonth(calDate.getMonth()+1); renderMiniCal(); }
function jumpToDate(ds) { weekStart = getMondayOf(new Date(ds)); renderAll(); scrollToNow(); }

/* ── SIDEBAR ── */
function renderSidebar() {
  // categories
  let html = `<div class="cat-item${!filterCat?' active':''}" onclick="setCat(null)">
    <span class="cat-dot" style="background:var(--accent)"></span>
    <span>ทั้งหมด</span>
    <span class="cat-count">${events.length}</span>
  </div>`;
  CATS.forEach(c => {
    const cnt = events.filter(e => e.cat === c.id).length;
    html += `<div class="cat-item${filterCat===c.id?' active':''}" onclick="setCat('${c.id}')">
      <span class="cat-dot" style="background:${c.color}"></span>
      <span>${c.icon} ${c.label}</span>
      <span class="cat-count">${cnt}</span>
    </div>`;
  });
  document.getElementById('catList').innerHTML = html;

  // upcoming
  const now = new Date(); const todayStr = fmt(now); const nowMin = now.getHours()*60+now.getMinutes();
  const upcoming = events.filter(e => {
    if (e.date < todayStr) return false;
    if (e.date === todayStr && parseMin(e.end) <= nowMin) return false;
    return true;
  }).sort((a,b) => a.date!==b.date ? (a.date>b.date?1:-1) : parseMin(a.start)-parseMin(b.start)).slice(0,5);

  if (!upcoming.length) {
    document.getElementById('upcomingList').innerHTML = `<div class="empty-up">ไม่มีกิจกรรมที่จะมาถึง</div>`;
    return;
  }
  document.getElementById('upcomingList').innerHTML = upcoming.map(ev => {
    const cat = CATS.find(c => c.id === ev.cat) || CATS[4];
    return `<div class="upcoming-item" style="border-left-color:${ev.color}" onclick='openEdit("${ev.id}")'>
      <div class="upcoming-item-title">${cat.icon} ${ev.title}</div>
      <div class="upcoming-item-time">${ev.date} · ${fmtTime(ev.start)}–${fmtTime(ev.end)}</div>
    </div>`;
  }).join('');
}
function setCat(c) { filterCat = c; renderAll(); }

/* ── WEEK TIMETABLE ── */
function renderWeek() {
  const q = (document.getElementById('searchInput')||{}).value || '';
  const sq = q.toLowerCase();
  const days = [0,1,2,3,4,5,6].map(i => addDays(weekStart, i));
  const todayStr = fmt(new Date());

  // week label
  const opts = {month:'short'};
  const s = days[0], e = days[6];
  document.getElementById('weekLabel').textContent =
    `${s.getDate()} ${s.toLocaleDateString('th-TH',opts)} – ${e.getDate()} ${e.toLocaleDateString('th-TH',opts)} ${e.getFullYear()+543}`;

  // time column (24 hours × HOUR_PX)
  let tcHtml = '';
  for (let h = 0; h < TOTAL_H; h++) {
    tcHtml += `<div class="time-label" style="height:${HOUR_PX}px">${String(h).padStart(2,'0')}:00</div>`;
  }
  document.getElementById('timeCol').innerHTML = tcHtml;

  // days grid
  let dgHtml = '';
  days.forEach(day => {
    const ds = fmt(day);
    const isToday = ds === todayStr;
    const dayEvs = events.filter(ev => {
      if (ev.date !== ds) return false;
      if (filterCat && ev.cat !== filterCat) return false;
      if (sq && !ev.title.toLowerCase().includes(sq)) return false;
      return true;
    }).sort((a,b) => parseMin(a.start) - parseMin(b.start));

    dgHtml += `<div class="day-col">
      <div class="day-header${isToday?' today-col':''}">
        <span style="font-size:10px">${DAY_FULL[day.getDay()]}</span>
        <span class="day-num">${day.getDate()}</span>
      </div>
      <div class="day-body" style="height:${TOTAL_H*HOUR_PX}px" onclick="clickDayBody(event,'${ds}')">`;

    // hour lines
    for (let h = 0; h < TOTAL_H; h++) {
      dgHtml += `<div class="hour-line" style="top:${h*HOUR_PX}px"></div>`;
    }

    // now indicator
    if (isToday) {
      const now = new Date(); const min = now.getHours()*60 + now.getMinutes();
      dgHtml += `<div class="now-line" id="nowLine" style="top:${(min/60)*HOUR_PX}px"></div>`;
    }

    // event blocks
    dayEvs.forEach(ev => {
      const topPx  = (parseMin(ev.start) / 60) * HOUR_PX;
      const hPx    = Math.max((parseMin(ev.end) - parseMin(ev.start)) / 60 * HOUR_PX, 24);
      const cat    = CATS.find(c => c.id === ev.cat) || CATS[4];
      const bright = hexBright(ev.color);
      const fg     = bright > 150 ? 'rgba(0,0,0,.85)' : '#fff';
      dgHtml += `<div class="event-block" style="top:${topPx}px;height:${hPx}px;background:${ev.color};color:${fg}"
        onclick='openEdit("${ev.id}");event.stopPropagation()'>
        <div class="event-title">${cat.icon} ${ev.title}</div>
        <div class="event-time">${fmtTime(ev.start)}–${fmtTime(ev.end)}</div>
      </div>`;
    });

    dgHtml += `</div></div>`;
  });
  document.getElementById('daysGrid').innerHTML = dgHtml;
}

function prevWeek() { weekStart = addDays(weekStart,-7); renderAll(); }
function nextWeek() { weekStart = addDays(weekStart, 7); renderAll(); }
function goToday()  { weekStart = getMondayOf(new Date()); calDate = new Date(); renderAll(); scrollToNow(); }

function clickDayBody(e, ds) {
  if (e.target.closest('.event-block')) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const y    = e.clientY - rect.top;
  const min  = Math.round((y / HOUR_PX) * 60 / 15) * 15;
  const h = Math.floor(min/60), m = min%60;
  const ts = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  openAddModal(ds, ts);
}

/* ── MODAL ── */
function openAddModal(date, startTime) {
  editId = null;
  document.getElementById('modalTitle').textContent  = 'เพิ่มกิจกรรม';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('fTitle').value = '';
  document.getElementById('fDate').value  = date || fmt(new Date());
  document.getElementById('fStart').value = startTime || '09:00';
  document.getElementById('fEnd').value   = startTime ? addMins(startTime, 60) : '10:00';
  document.getElementById('fDesc').value  = '';
  renderCatSelect('study');
  renderColorSelect('#007aff');
  showModal();
}
function openEdit(id) {
  const ev = events.find(e => e.id === id); if (!ev) return;
  editId = id;
  document.getElementById('modalTitle').textContent  = 'แก้ไขกิจกรรม';
  document.getElementById('deleteBtn').style.display = 'block';
  document.getElementById('fTitle').value = ev.title;
  document.getElementById('fDate').value  = ev.date;
  document.getElementById('fStart').value = ev.start;
  document.getElementById('fEnd').value   = ev.end;
  document.getElementById('fDesc').value  = ev.desc || '';
  renderCatSelect(ev.cat);
  renderColorSelect(ev.color);
  showModal();
}
function renderCatSelect(sel) {
  document.getElementById('catSelect').innerHTML = CATS.map(c =>
    `<div class="cat-option${c.id===sel?' selected':''}" onclick="pickCat('${c.id}')">${c.icon}<br><span style="font-size:10px">${c.label}</span></div>`
  ).join('');
}
function pickCat(id) { renderCatSelect(id); }
function renderColorSelect(sel) {
  document.getElementById('colorSelect').innerHTML = COLORS.map(c =>
    `<div class="color-dot${c===sel?' selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
}
function pickColor(c) { renderColorSelect(c); }
function selectedCat() {
  const opts = document.querySelectorAll('.cat-option');
  const sel  = document.querySelector('.cat-option.selected');
  return sel ? CATS[Array.from(opts).indexOf(sel)].id : 'other';
}
function selectedColor() {
  const sel = document.querySelector('.color-dot.selected');
  return sel ? sel.style.background : '#007aff';
}
function saveEvent() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) {
    const inp = document.getElementById('fTitle');
    inp.focus(); inp.style.borderColor = 'var(--red)';
    setTimeout(() => inp.style.borderColor = '', 1500);
    return;
  }
  const ev = {
    id:    editId || uid(),
    title,
    cat:   selectedCat(),
    date:  document.getElementById('fDate').value,
    start: document.getElementById('fStart').value,
    end:   document.getElementById('fEnd').value,
    desc:  document.getElementById('fDesc').value,
    color: selectedColor(),
  };
  if (editId) { const i = events.findIndex(e => e.id === editId); if (i >= 0) events[i] = ev; }
  else events.push(ev);
  save(); closeModal(); renderAll();
}
function deleteCurrentEvent() { closeModal(); deleteTarget = editId; document.getElementById('confirmOverlay').classList.add('show'); }
function closeConfirm()       { document.getElementById('confirmOverlay').classList.remove('show'); deleteTarget = null; }
function confirmDelete()      { if (deleteTarget) { events = events.filter(e => e.id !== deleteTarget); save(); renderAll(); } closeConfirm(); }
function showModal()          { document.getElementById('eventOverlay').classList.add('show'); }
function closeModal()         { document.getElementById('eventOverlay').classList.remove('show'); editId = null; }
function closeIfOverlay(e)    { if (e.target === document.getElementById('eventOverlay')) closeModal(); }

function toggleDark() {
  document.body.classList.toggle('dark');
  document.getElementById('darkToggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
}
function toggleSearch() {
  const w = document.getElementById('searchWrap');
  if (w.style.display === 'none') { w.style.display = 'block'; setTimeout(() => document.getElementById('searchInput').focus(), 50); }
  else { w.style.display = 'none'; document.getElementById('searchInput').value = ''; renderAll(); }
}

/* ── INIT ── */
load();
renderAll();
scrollToNow();

// update now-line every 30 s
setInterval(() => {
  document.querySelectorAll('#nowLine').forEach(el => {
    const now = new Date(); const min = now.getHours()*60 + now.getMinutes();
    el.style.top = (min/60 * HOUR_PX) + 'px';
  });
}, 30000);
</script>
